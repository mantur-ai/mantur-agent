name: Sync desktop release to TOS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public stable release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-publication
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: macos-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download public release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false)' | grep -q isDraft
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
      - name: Install publisher dependencies
        run: |
          python -m pip install boto3==1.42.97 PyYAML==6.0.3
          python -m unittest discover -s scripts -p test_desktop_publish_tos.py
      - name: Publish verified release
        env:
          TAG: ${{ inputs.tag }}
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
          TOS_REGION: ap-southeast-1
          TOS_ENDPOINT: https://tos-s3-ap-southeast-1.volces.com
          TOS_BUCKET: mantur-pro
          TOS_PREFIX: mantur-agent
          TOS_PUBLIC_URL: https://resource.mantur.ai/mantur-agent
        run: python scripts/desktop-publish-tos.py release "${TAG#v}"
