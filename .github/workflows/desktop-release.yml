name: Desktop release

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: Native macOS architectures included in this release
        required: true
        type: choice
        default: arm64
        options:
          - both
          - arm64
      windows:
        description: Include a signed Windows x64 installer and its automatic update metadata
        required: true
        type: boolean
        default: false
      publish:
        description: Publish all selected signed platform builds to GitHub Releases. Must run from the matching v* tag.
        required: true
        type: boolean
        default: false
      release_notes:
        description: User-facing release notes, required when publishing
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'desktop-publication' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
      metadata: ${{ steps.version.outputs.metadata }}
      mantur_cut_distribution: ${{ steps.version.outputs.mantur_cut_distribution }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve and authorize desktop version
        id: version
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          set -euo pipefail
          case "$ARCHITECTURES" in
            both|arm64) ;;
            *) echo "::error::Select both or arm64 architectures."; exit 1 ;;
          esac
          [ "$ARCHITECTURES" = arm64 ] && [ "$WINDOWS" = false ] || {
            echo "::error::The reviewed media input supports macOS arm64 only."
            exit 1
          }
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const include = [
            { arch: 'arm64', runner: 'macos-15', script: 'desktop:dist:mac:arm64', app: 'apps/desktop/dist/mac-arm64/ManTur Agent.app' },
            { arch: 'x64', runner: 'macos-15-intel', script: 'desktop:dist:mac:x64', app: 'apps/desktop/dist/mac/ManTur Agent.app' },
          ].filter(target => process.env.ARCHITECTURES === 'both' || target.arch === 'arm64')
          process.stdout.write(`matrix=${JSON.stringify({ include })}\n`)
          NODE
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            metadata=latest
            if [[ "$version" == *-rc.* ]]; then metadata=rc; fi
          else
            echo "::error::A stable or numbered rc version is required."
            exit 1
          fi
          printf 'metadata=%s\n' "$metadata" >> "$GITHUB_OUTPUT"
          mantur_cut_distribution="$(sha256sum apps/desktop/mantur-cut/source.json | cut -d ' ' -f1)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'mantur_cut_distribution=%s\n' "$mantur_cut_distribution" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            [ -n "${RELEASE_NOTES//[[:space:]]/}" ] || {
              echo "::error::User-facing release notes are required for publication."
              exit 1
            }
            [ "$REF_TYPE" = tag ] && [ "$REF_NAME" = "v$version" ] || {
              echo "::error::Publication must run from tag v$version."
              exit 1
            }
          fi

  macos:
    name: Signed macOS / ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: macos-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require signing and notarization credentials
        run: |
          set -euo pipefail
          for name in APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID CSC_KEY_PASSWORD CSC_LINK; do
            [ -n "${!name:-}" ] || {
              echo "::error::$name is not configured in the macos-release environment."
              exit 1
            }
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mantur client and desktop carrier
        run: pnpm run build:mantur

      - name: Test desktop launch contract
        run: pnpm exec vitest run apps/desktop/tests/runtime.spec.ts apps/desktop/tests/github-release-check.spec.ts apps/desktop/tests/tos-release-check.spec.ts apps/desktop/tests/updater.spec.ts scripts/client-build-environment.client.spec.ts scripts/desktop-signing-scan.spec.ts

      - name: Restore pinned Mantur Cut source cache
        uses: actions/cache@v5
        with:
          path: .cache/mantur-cut
          key: mantur-cut-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/mantur-cut/source.json', 'apps/desktop/mantur-cut/*media*.json', 'scripts/mantur-media-build*', 'scripts/mantur-media-inputs.py', 'packages/client/ui-mantur-editing/adapters/mantur-cut*.patch') }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify and prepare pinned media candidate
        run: |
          python3 -m unittest discover -s scripts -p test_mantur_media_inputs.py
          python3 scripts/mantur-media-inputs.py --prepare-candidate --cache-dir .cache/mantur-cut/native-media

      - name: Require native compiler
        run: xcrun clang --version

      - name: Build, sign, and notarize native installer
        run: |
          ulimit -n "$(ulimit -Hn)"
          pnpm run ${{ matrix.script }}

      - name: Verify Developer ID signature and notarization ticket
        env:
          APP_PATH: ${{ matrix.app }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Smoke packaged dependency closure
        run: pnpm run desktop:smoke

      - name: Retain desktop debugging symbols
        uses: actions/upload-artifact@v7
        with:
          name: desktop-symbols-macos-${{ matrix.arch }}
          path: apps/desktop/dist/symbols/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.dmg
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.dmg.blockmap
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.zip
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.zip.blockmap
            apps/desktop/dist/${{ needs.validate.outputs.metadata }}-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Signed Windows / x64
    if: inputs.windows
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    environment: windows-release
    defaults:
      run:
        shell: pwsh
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require Windows signing credentials
        run: |
          foreach ($name in 'CSC_LINK', 'CSC_KEY_PASSWORD') {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "$name is not configured in the windows-release environment."
            }
          }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mantur client and desktop carrier
        run: pnpm run build:mantur

      - name: Test desktop launch contract
        run: pnpm exec vitest run apps/desktop/tests/runtime.spec.ts apps/desktop/tests/github-release-check.spec.ts apps/desktop/tests/tos-release-check.spec.ts apps/desktop/tests/updater.spec.ts scripts/client-build-environment.client.spec.ts scripts/desktop-signing-scan.spec.ts

      - name: Verify Windows sandbox startup without a parent console
        if: runner.os == 'Windows'
        run: pnpm exec vitest run packages/sandbox/sandbox-windows-acl/tests/runner.spec.ts packages/sandbox/sandbox-windows-acl/tests/console.spec.ts

      - name: Restore pinned Mantur Cut source cache
        uses: actions/cache@v5
        with:
          path: .cache/mantur-cut
          key: mantur-cut-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/mantur-cut/source.json', 'packages/client/ui-mantur-editing/adapters/mantur-cut.patch', 'packages/client/ui-mantur-editing/adapters/mantur-cut-packaged.patch') }}

      - name: Build and sign Windows installer
        run: pnpm run desktop:dist:win:x64

      - name: Verify Authenticode signatures
        run: |
          foreach ($path in 'apps/desktop/dist/Mantur-Agent-Windows-x64.exe', 'apps/desktop/dist/win-unpacked/ManTur Agent.exe') {
            $signature = Get-AuthenticodeSignature -LiteralPath $path -ErrorAction Stop
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${path}: $($signature.Status)"
            }
          }

      - name: Smoke packaged dependency closure
        run: pnpm run desktop:smoke

      - name: Retain desktop debugging symbols
        uses: actions/upload-artifact@v7
        with:
          name: desktop-symbols-windows-x64
          path: apps/desktop/dist/symbols/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/dist/Mantur-Agent-Windows-x64.exe
            apps/desktop/dist/Mantur-Agent-Windows-x64.exe.blockmap
            apps/desktop/dist/${{ needs.validate.outputs.metadata }}.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble signed desktop release
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.macos.result == 'success' && (!inputs.windows || needs.windows.result == 'success') }}
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Apple Silicon artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-arm64
          path: release-input/desktop-macos-arm64

      - name: Download Intel artifacts
        if: inputs.architectures == 'both'
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-x64
          path: release-input/desktop-macos-x64

      - name: Download Windows artifacts
        if: inputs.windows
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows-x64
          path: release-input/desktop-windows-x64

      - name: Merge native artifacts and update metadata
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          WINDOWS: ${{ inputs.windows }}
          METADATA: ${{ needs.validate.outputs.metadata }}
        run: |
          set -euo pipefail
          mkdir release
          arches=(arm64)
          if [ "$ARCHITECTURES" = both ]; then arches+=(x64); fi
          required_artifacts=()
          for arch in "${arches[@]}"; do
            required_artifacts+=("release-input/desktop-macos-$arch/$METADATA-mac.yml")
            for extension in dmg dmg.blockmap zip zip.blockmap; do
              required_artifacts+=("release-input/desktop-macos-$arch/Mantur-Agent-macOS-$arch.$extension")
            done
          done
          if [ "$WINDOWS" = true ]; then
            for filename in Mantur-Agent-Windows-x64.exe Mantur-Agent-Windows-x64.exe.blockmap "$METADATA.yml"; do
              required_artifacts+=("release-input/desktop-windows-x64/$filename")
            done
          fi
          for artifact in "${required_artifacts[@]}"; do
            [ -f "$artifact" ] || {
              echo "::error::Required desktop release artifact is missing: $artifact"
              exit 1
            }
          done
          for artifact in "${required_artifacts[@]}"; do
            if [[ "$artifact" != *"/$METADATA-mac.yml" ]]; then
              cp "$artifact" "release/$(basename "$artifact")"
            fi
          done
          if [ "$ARCHITECTURES" = both ]; then
            pnpm exec tsx scripts/desktop-release-update-info.ts \
              "release-input/desktop-macos-arm64/$METADATA-mac.yml" \
              "release-input/desktop-macos-x64/$METADATA-mac.yml" \
              "release/$METADATA-mac.yml"
          else
            cp "release-input/desktop-macos-arm64/$METADATA-mac.yml" "release/$METADATA-mac.yml"
          fi
          if [ "$WINDOWS" = true ]; then
            echo 'Windows: signed x64 installer and update metadata included.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Windows: NOT INCLUDED; no Windows signing or release evidence is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          find release -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} \; \
            | sed 's#  release/#  #' \
            | sort -k2 > release/SHA256SUMS

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Archive verified desktop sources
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p test_desktop_release_sources.py
          python -m unittest discover -s scripts -p test_mantur_media_inputs.py
          python scripts/desktop-release-sources.py release
          find release -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} \; \
            | sed 's#  release/#  #' \
            | sort -k2 > release/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ needs.validate.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: ${{ !cancelled() && inputs.publish && needs.validate.result == 'success' && needs.assemble.result == 'success' }}
    needs: [validate, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: macos-release
    permissions:
      contents: write
    env:
      MANTUR_CUT_DISTRIBUTION_APPROVAL: ${{ vars.MANTUR_CUT_DISTRIBUTION_APPROVAL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: desktop-release-${{ needs.validate.outputs.version }}
          path: release

      - name: Verify release artifact hashes
        run: cd release && sha256sum -c SHA256SUMS

      - name: Require review of the exact Mantur Cut distribution
        env:
          MANTUR_CUT_DISTRIBUTION: ${{ needs.validate.outputs.mantur_cut_distribution }}
        run: |
          expected="approved:$MANTUR_CUT_DISTRIBUTION"
          [ "$MANTUR_CUT_DISTRIBUTION_APPROVAL" = "$expected" ] || {
            echo "::error::MANTUR_CUT_DISTRIBUTION_APPROVAL must approve the exact pinned distribution."
            exit 1
          }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install TOS publisher dependencies
        run: |
          python -m pip install boto3==1.42.97 PyYAML==6.0.3
          python -m unittest discover -s scripts -p test_desktop_publish_tos.py

      - name: Preflight release publication without remote writes
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
          TOS_REGION: ap-southeast-1
          TOS_ENDPOINT: https://tos-s3-ap-southeast-1.volces.com
          TOS_BUCKET: mantur-pro
          TOS_PREFIX: mantur-agent
          TOS_PUBLIC_URL: https://mantur-pro.tos-accelerate.volces.com/mantur-agent
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/desktop-publish-tos.py release "$RELEASE_VERSION" --check ${{ inputs.windows && '--require-windows' || '' }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; published desktop assets are never replaced."
            exit 1
          fi
          release_flags=(--verify-tag)
          case "$VERSION" in
            *-rc.*) release_flags+=(--prerelease --latest=false) ;;
          esac
          notes_file="$(mktemp "$RUNNER_TEMP/desktop-release-notes.XXXXXX")"
          trap 'rm -f "$notes_file"' EXIT
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ManTur Agent $VERSION" \
            --notes-file "$notes_file" \
            "${release_flags[@]}"

      - name: Publish installers and update channel to TOS
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
          TOS_REGION: ap-southeast-1
          TOS_ENDPOINT: https://tos-s3-ap-southeast-1.volces.com
          TOS_BUCKET: mantur-pro
          TOS_PREFIX: mantur-agent
          TOS_PUBLIC_URL: https://mantur-pro.tos-accelerate.volces.com/mantur-agent
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/desktop-publish-tos.py release "$RELEASE_VERSION" ${{ inputs.windows && '--require-windows' || '' }}
