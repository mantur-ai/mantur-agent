# The Mantur Agent product layer over dsh-base and dsh-web-app.

- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: ''

# Keep URL readiness for the desktop supervisor, but omit the generic Web GUI
# identity and source-checkout sections from model requests.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

- id: ui-brand-official
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: ui-plan
  disabled: true

- id: ui-workspace
  config:
    newSessionWorkspace: explicit

- insert:
    - id: mantur-identity
      name: '@deepseek-ai/dsh-mantur-app'
      config:
        persona: >-
          你是漫途Agent，由漫途（Mantur）打造，专门在用户电脑本地完成漫剧创作与生产。你的职责是围绕漫剧项目完成故事构思、剧本、分镜、视觉素材、音频、剪辑方案和制作交付。你应使用当前本地工作区与可用工具直接推进制作，在获得必要授权后执行本地操作，并保持项目文件清晰有序。你的工作目录是 {{cwd}}。
    - id: ui-brand-mantur
      name: '@deepseek-ai/dsh-client-ui-brand-mantur'
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: mantur-account
      name: '@deepseek-ai/dsh-authorization-manturhub'
      config:
        identity: !!js process.env.DSH_MANTUR_NATIVE_ACCOUNT === '1' ? 'desktop-managed' : 'standalone'
        native: !!js >-
          process.env.DSH_MANTUR_NATIVE_ACCOUNT === '1'
            ? { environmentLabel: 'ManturHub', requestTimeoutMs: 30000, maxResponseBytes: 65536, leaseMs: 86400000, revocationRetryMs: 60000 }
            : undefined
    - id: mantur-marketplace
      name: '@deepseek-ai/dsh-manturhub-marketplace'
    - id: mantur-projects
      name: '@deepseek-ai/dsh-mantur-projects'
      config:
        defaultRoot: !!js process.env.DSH_MANTUR_PROJECTS_ROOT
    - id: ui-mantur-navigation
      name: '@deepseek-ai/dsh-client-ui-mantur-navigation'
      config:
        recommendations:
          script: [short-drama]
          production: [drama-asset-seedance-pipeline, character-forge, mantur-video-prompt-director, mantur-acting-director]
          editing: [mantur-smartclip, four-dimensional-voice-director]
          assets: [character-forge, mantur-image-prompt-director, chinese-wonderland-director, four-dimensional-voice-director]
    - id: ui-mantur-account
      name: '@deepseek-ai/dsh-client-ui-mantur-account'

# Enabled only by a profile that supplies a local editor URL.
- insert:
    - id: ui-mantur-editing
      name: '@deepseek-ai/dsh-client-ui-mantur-editing'
      disabled: true
