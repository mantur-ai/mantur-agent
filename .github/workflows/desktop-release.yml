name: Desktop release

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: Native macOS architectures included in this release
        required: true
        type: choice
        default: both
        options:
          - both
          - arm64
      publish:
        description: Publish the signed and notarized macOS build to GitHub Releases. Must run from the matching v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'desktop-publication' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
      mantur_cut_distribution: ${{ steps.version.outputs.mantur_cut_distribution }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve and authorize desktop version
        id: version
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          case "$ARCHITECTURES" in
            both|arm64) ;;
            *) echo "::error::Select both or arm64 architectures."; exit 1 ;;
          esac
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const include = [
            { arch: 'arm64', runner: 'macos-15', script: 'desktop:dist:mac:arm64', app: 'apps/desktop/dist/mac-arm64/漫途Agent.app' },
            { arch: 'x64', runner: 'macos-15-intel', script: 'desktop:dist:mac:x64', app: 'apps/desktop/dist/mac/漫途Agent.app' },
          ].filter(target => process.env.ARCHITECTURES === 'both' || target.arch === 'arm64')
          process.stdout.write(`matrix=${JSON.stringify({ include })}\n`)
          NODE
          version="$(node -p "require('./apps/desktop/package.json').version")"
          mantur_cut_distribution="$(sha256sum apps/desktop/mantur-cut/source.json | cut -d ' ' -f1)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'mantur_cut_distribution=%s\n' "$mantur_cut_distribution" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            [ "$REF_TYPE" = tag ] && [ "$REF_NAME" = "v$version" ] || {
              echo "::error::Publication must run from tag v$version."
              exit 1
            }
          fi

  macos:
    name: Signed macOS / ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: macos-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require signing and notarization credentials
        run: |
          set -euo pipefail
          for name in APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID CSC_KEY_PASSWORD CSC_LINK; do
            [ -n "${!name:-}" ] || {
              echo "::error::$name is not configured in the macos-release environment."
              exit 1
            }
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mantur client and desktop carrier
        run: pnpm run build:mantur

      - name: Test desktop launch contract
        run: pnpm exec vitest run apps/desktop/tests/runtime.spec.ts apps/desktop/tests/github-release-check.spec.ts apps/desktop/tests/updater.spec.ts scripts/client-build-environment.client.spec.ts scripts/desktop-signing-scan.spec.ts

      - name: Restore pinned Mantur Cut source cache
        uses: actions/cache@v5
        with:
          path: .cache/mantur-cut
          key: mantur-cut-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/mantur-cut/source.json', 'packages/client/ui-mantur-editing/adapters/mantur-cut.patch', 'packages/client/ui-mantur-editing/adapters/mantur-cut-packaged.patch') }}

      - name: Require native compiler
        run: xcrun clang --version

      - name: Build, sign, and notarize native installer
        run: pnpm run ${{ matrix.script }}

      - name: Verify Developer ID signature and notarization ticket
        env:
          APP_PATH: ${{ matrix.app }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Smoke packaged dependency closure
        run: pnpm run desktop:smoke

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.dmg
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.dmg.blockmap
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.zip
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble macOS release
    needs: [validate, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-macos-*
          path: release-input

      - name: Merge native artifacts and update metadata
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          set -euo pipefail
          mkdir release
          arches=(arm64)
          if [ "$ARCHITECTURES" = both ]; then arches+=(x64); fi
          required_artifacts=()
          for arch in "${arches[@]}"; do
            for extension in dmg dmg.blockmap zip zip.blockmap; do
              required_artifacts+=("release-input/desktop-macos-$arch/Mantur-Agent-macOS-$arch.$extension")
            done
          done
          for artifact in "${required_artifacts[@]}"; do
            [ -f "$artifact" ] || {
              echo "::error::Required desktop release artifact is missing: $artifact"
              exit 1
            }
          done
          for artifact in "${required_artifacts[@]}"; do
            cp "$artifact" "release/$(basename "$artifact")"
          done
          if [ "$ARCHITECTURES" = both ]; then
            pnpm exec tsx scripts/desktop-release-update-info.ts \
              release-input/desktop-macos-arm64/latest-mac.yml \
              release-input/desktop-macos-x64/latest-mac.yml \
              release/latest-mac.yml
          else
            cp release-input/desktop-macos-arm64/latest-mac.yml release/latest-mac.yml
          fi
          find release -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} \; \
            | sed 's#  release/#  #' \
            | sort -k2 > release/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ needs.validate.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: inputs.publish
    needs: [validate, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: macos-release
    permissions:
      contents: write
    env:
      MANTUR_CUT_DISTRIBUTION_APPROVAL: ${{ vars.MANTUR_CUT_DISTRIBUTION_APPROVAL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-release-${{ needs.validate.outputs.version }}
          path: release

      - name: Verify release artifact hashes
        run: cd release && sha256sum -c SHA256SUMS

      - name: Require review of the exact Mantur Cut distribution
        env:
          MANTUR_CUT_DISTRIBUTION: ${{ needs.validate.outputs.mantur_cut_distribution }}
        run: |
          expected="approved:$MANTUR_CUT_DISTRIBUTION"
          [ "$MANTUR_CUT_DISTRIBUTION_APPROVAL" = "$expected" ] || {
            echo "::error::MANTUR_CUT_DISTRIBUTION_APPROVAL must approve the exact pinned distribution."
            exit 1
          }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; published desktop assets are never replaced."
            exit 1
          fi
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "漫途Agent $VERSION" \
            --generate-notes \
            "${prerelease[@]}"
