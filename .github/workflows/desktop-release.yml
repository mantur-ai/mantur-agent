name: Desktop release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed native builds to GitHub Releases. Must run from the matching v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'desktop-publication' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve and authorize desktop version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            [ "$REF_TYPE" = tag ] && [ "$REF_NAME" = "v$version" ] || {
              echo "::error::Publication must run from tag v$version."
              exit 1
            }
          fi

  macos:
    name: Signed macOS / ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: macos-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            script: desktop:dist:mac:arm64
            app: apps/desktop/dist/mac-arm64/漫途Agent.app
          - arch: x64
            runner: macos-15-intel
            script: desktop:dist:mac:x64
            app: apps/desktop/dist/mac/漫途Agent.app
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require signing and notarization credentials
        run: |
          set -euo pipefail
          for name in APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID CSC_KEY_PASSWORD CSC_LINK; do
            [ -n "${!name:-}" ] || {
              echo "::error::$name is not configured in the macos-release environment."
              exit 1
            }
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mantur client and desktop carrier
        run: pnpm run build:mantur

      - name: Test desktop launch contract
        run: pnpm exec vitest run apps/desktop/tests/runtime.spec.ts scripts/client-build-environment.client.spec.ts

      - name: Build, sign, and notarize native installer
        run: pnpm run ${{ matrix.script }}

      - name: Verify Developer ID signature and notarization ticket
        env:
          APP_PATH: ${{ matrix.app }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Smoke packaged dependency closure
        run: pnpm run desktop:smoke

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.dmg
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.dmg.blockmap
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.zip
            apps/desktop/dist/Mantur-Agent-macOS-${{ matrix.arch }}.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Signed Windows / x64
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    environment: windows-release
    env:
      DSH_TELEMETRY_DISABLED: '1'
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require Windows signing credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'WIN_CSC_KEY_PASSWORD', 'WIN_CSC_LINK', 'WINDOWS_CERTIFICATE_THUMBPRINT') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is not configured in the windows-release environment."
            }
          }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mantur client and desktop carrier
        run: pnpm run build:mantur

      - name: Test desktop launch contract
        run: pnpm exec vitest run apps/desktop/tests/runtime.spec.ts scripts/client-build-environment.client.spec.ts

      - name: Build and sign native installer
        run: pnpm run desktop:dist:win:x64

      - name: Verify Authenticode signatures and timestamps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
          $signedFiles = @(
            'apps/desktop/dist/win-unpacked/漫途Agent.exe',
            'apps/desktop/dist/Mantur-Agent-Windows-x64.exe'
          )
          foreach ($path in $signedFiles) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required signed Windows file is missing: $path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode signature is not valid for ${path}: $($signature.StatusMessage)"
            }
            $actual = $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
            if ($actual -ne $expected) {
              throw "Authenticode signer thumbprint does not match WINDOWS_CERTIFICATE_THUMBPRINT for $path."
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode signature has no timestamp for $path."
            }
          }

      - name: Smoke packaged dependency closure
        run: pnpm run desktop:smoke

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/dist/Mantur-Agent-Windows-x64.exe
            apps/desktop/dist/Mantur-Agent-Windows-x64.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble desktop release
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-input

      - name: Merge native artifacts and update metadata
        run: |
          set -euo pipefail
          mkdir release
          required_artifacts=(
            release-input/desktop-macos-arm64/Mantur-Agent-macOS-arm64.dmg
            release-input/desktop-macos-arm64/Mantur-Agent-macOS-arm64.dmg.blockmap
            release-input/desktop-macos-arm64/Mantur-Agent-macOS-arm64.zip
            release-input/desktop-macos-arm64/Mantur-Agent-macOS-arm64.zip.blockmap
            release-input/desktop-macos-x64/Mantur-Agent-macOS-x64.dmg
            release-input/desktop-macos-x64/Mantur-Agent-macOS-x64.dmg.blockmap
            release-input/desktop-macos-x64/Mantur-Agent-macOS-x64.zip
            release-input/desktop-macos-x64/Mantur-Agent-macOS-x64.zip.blockmap
            release-input/desktop-windows-x64/Mantur-Agent-Windows-x64.exe
            release-input/desktop-windows-x64/Mantur-Agent-Windows-x64.exe.blockmap
            release-input/desktop-windows-x64/latest.yml
          )
          for artifact in "${required_artifacts[@]}"; do
            [ -f "$artifact" ] || {
              echo "::error::Required desktop release artifact is missing: $artifact"
              exit 1
            }
          done
          for artifact in "${required_artifacts[@]}"; do
            cp "$artifact" "release/$(basename "$artifact")"
          done
          pnpm exec tsx scripts/desktop-release-update-info.ts \
            release-input/desktop-macos-arm64/latest-mac.yml \
            release-input/desktop-macos-x64/latest-mac.yml \
            release/latest-mac.yml
          find release -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} \; \
            | sed 's#  release/#  #' \
            | sort -k2 > release/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ needs.validate.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: inputs.publish
    needs: [validate, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: macos-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-release-${{ needs.validate.outputs.version }}
          path: release

      - name: Verify release artifact hashes
        run: cd release && sha256sum -c SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; published desktop assets are never replaced."
            exit 1
          fi
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "漫途Agent $VERSION" \
            --generate-notes \
            "${prerelease[@]}"
